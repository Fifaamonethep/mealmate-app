<!doctype html>
<html lang="en" class="">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/mealmate-logo.png" />
    <link rel="apple-touch-icon" href="/mealmate-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="MealMate - Split bills with friends easily. Track group expenses, settle debts with QR payments." />
    <meta name="theme-color" content="#16a34a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800;900&family=Noto+Sans+Lao:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <title>MealMate – Split Bills Easily</title>
    <style>
      /* Prevent FOUC - apply dark mode immediately */
      html.dark { background: #030712; color: #f3f4f6; }
      body { font-family: 'Prompt', 'Noto Sans Lao', system-ui, -apple-system, sans-serif; margin: 0; }
    </style>
    <script>
      // Apply dark mode before page renders to prevent flash
      if (localStorage.getItem('theme') === 'dark' || 
        (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
